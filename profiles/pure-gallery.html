<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GALLERY</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
/* ══════════════════════════════════════════
   ✎ 여기만 고치면 돼요
   THEME  : 'light' (밝게) / 'dark' (어둡게)
   IMAGES : 사진 목록. src = 사진 주소, cap = 아래 설명 (없어도 됨)
            주소는 이 파일 기준이라 assets 폴더 사진은 '../assets/images/파일.png' 처럼 써요
══════════════════════════════════════════ */
var THEME = 'light';
var TITLE = 'PURE · GALLERY';
var IMAGES = [
  { src: '../assets/images/gall/pure-01.png', cap: '' },
  { src: '../assets/images/gall/pure-02.png', cap: '' },
  { src: '../assets/images/gall/pure-03.png', cap: '' }
];
</script>
<style>
  :root{--bg:#F6FAFD;--card:#fff;--ink:#14324A;--sub:#7C93A6;--line:#DCE8F1;--pt:#1E8FD6;--wash:#EAF3F9}
  html.dark{--bg:#0B1724;--card:#112131;--ink:#E6EEF4;--sub:#6F8BA0;--line:#1D3448;--pt:#5BB8F0;--wash:#152A3D}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;letter-spacing:-.02em}
  .wrap{padding:18px 16px 24px}
  .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 14px}
  .hd b{font-weight:900;font-size:15px}
  .hd small{font-weight:700;font-size:11px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .it{margin:0;cursor:zoom-in;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line)}
  .it .ph{aspect-ratio:1;background:var(--wash) center/cover no-repeat;transition:transform .3s}
  .it:hover .ph{transform:scale(1.04)}
  .it figcaption{padding:7px 9px 8px;font-size:11px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it figcaption:empty{display:none}
  .empty{padding:40px 0;text-align:center;font-size:12px;color:var(--sub)}
  .lb{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;background:rgba(8,18,28,.82);cursor:zoom-out}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:calc(100% - 60px);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .lb p{margin:0;color:#fff;font-size:12px;font-weight:700}
  .lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font:900 16px Pretendard;cursor:pointer}
  .lb .pv{left:12px}.lb .nx{right:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><b id="tt"></b><small id="ct"></small></div>
  <div class="grid" id="g"></div>
</div>
<div class="lb" id="lb"><button class="nv pv" type="button" aria-label="이전">‹</button><img id="lbi" alt=""><p id="lbc"></p><button class="nv nx" type="button" aria-label="다음">›</button></div>
<script>
(function(){
  if (THEME === 'dark') document.documentElement.classList.add('dark');
  var g = document.getElementById('g'), lb = document.getElementById('lb'), lbi = document.getElementById('lbi'), lbc = document.getElementById('lbc'), cur = 0;
  document.getElementById('tt').textContent = TITLE;
  document.getElementById('ct').textContent = IMAGES.length + ' PHOTOS';
  if (!IMAGES.length){ g.outerHTML = '<p class="empty">아직 사진이 없어요.</p>'; return; }
  IMAGES.forEach(function(im, i){
    var f = document.createElement('figure'); f.className = 'it';
    var ph = document.createElement('div'); ph.className = 'ph'; ph.style.backgroundImage = 'url("' + im.src + '")';
    var c = document.createElement('figcaption'); c.textContent = im.cap || '';
    f.appendChild(ph); f.appendChild(c); f.onclick = function(){ show(i); }; g.appendChild(f);
  });
  function show(i){ cur = (i + IMAGES.length) % IMAGES.length; lbi.src = IMAGES[cur].src; lbc.textContent = IMAGES[cur].cap || ''; lb.classList.add('on'); }
  lb.onclick = function(e){ if (e.target.classList.contains('pv')) show(cur - 1); else if (e.target.classList.contains('nx')) show(cur + 1); else lb.classList.remove('on'); };
  document.addEventListener('keydown', function(e){ if (!lb.classList.contains('on')) return; if (e.key === 'Escape') lb.classList.remove('on'); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });
})();
</script>
</body>
</html>
