# 글 목록(posts/posts.json)을 만들고 사이트를 GitHub Pages 에 올려요.
# main 브랜치에 무언가 저장(커밋)될 때마다 자동으로 실행돼요. 직접 건드릴 필요 없어요.
name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 글 목록 만들기
        run: |
          pip install markdown pyyaml
          python tools/build_posts.py --pages

      - name: 글 목록 · 새로 붙은 글 번호 저장소에도 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || (git commit -m "글 목록 갱신 [skip ci]" && (git push || (git pull --rebase origin main && git push)))

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: pages
        uses: actions/deploy-pages@v4